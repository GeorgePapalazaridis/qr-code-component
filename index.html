<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A QR Code Component built as part of a Frontend Mentor challenge." />
        <meta name="keywords" content="HTML, CSS, Frontend Mentor, Challenge, QR Code Component" />
        <meta name="author" content="George Papalazaridis" />
        <meta name="theme-color" content="hsl(212, 45%, 89%)">

        <meta property="og:title" content="QR Code Component" />
        <meta property="og:description" content="A QR Code Component built as part of a Frontend Mentor challenge." />
        <meta property="og:image" content="images/image-qr-code.png" />
        <meta property="og:url" content="https://frontend-mentor-qr-code-component.netlify.app/" />

        <title>QR Code Component</title>

        <script type="module">
            const isProduction = window.location.hostname === "georgepapalazaridis.github.io";
            const baseUrl = isProduction ? "/qr-code-component/" : "/";
            document.write(`<base href="${baseUrl}" />`);
        </script>

        <link rel="stylesheet" href="styles/style.css" />
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
    </head>

    <body>
        <main class="qr-container">
            <a href="https://www.frontendmentor.io/" target="_blank" rel="noopener noreferrer" class="qr-link">
                <section class="qr-code-card">
                    <div class="qr-image-wrapper">
                        <img src="images/image-qr-code.png"
                            alt="QR code leading to Frontend Mentor for coding challenges" class="qr-image" />
                    </div>
                    <div class="qr-text-wrapper">
                        <h1 class="qr-title">
                            Improve your front-end skills by building projects
                        </h1>
                        <p class="qr-description">
                            Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
                        </p>
                    </div>
                </section>
            </a>
        </main>
    </body>

</html>
